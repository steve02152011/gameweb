<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>悠閒海灣：像素休閒釣魚物語</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --gold: #f59e0b;
      --gold-light: #fef3c7;
      --accent: #38bdf8;
      --green-soft: #22c55e;
      --pixel-font: "Courier New", Courier, monospace;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }
    #viewport-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(15,23,42,0.92) 0%, rgba(15,23,42,0) 100%);
      z-index: 20;
      pointer-events: none;
    }
    .hud-left, .hud-right {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-pixel {
      background: #1e293b;
      color: #f8fafc;
      border: 2px solid #64748b;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 0 #0f172a;
      transition: all 0.08s ease;
      text-decoration: none;
    }
    .btn-pixel:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f172a;
    }
    .btn-pixel.gold {
      background: #b45309;
      border-color: #fbbf24;
      color: #fef3c7;
    }
    .btn-pixel.cyan {
      background: #0369a1;
      border-color: #38bdf8;
      color: #e0f2fe;
    }
    .btn-pixel.danger {
      background: #991b1b;
      border-color: #f87171;
      color: #fee2e2;
    }
    .badge-gold {
      background: rgba(245, 158, 11, 0.22);
      border: 1px solid #f59e0b;
      color: #fbbf24;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(5, 10, 20, 0.82);
      backdrop-filter: blur(5px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .pixel-box {
      background: #111827;
      border: 3px solid #475569;
      border-radius: 12px;
      width: 100%;
      max-width: 720px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px rgba(0,0,0,0.7), inset 0 0 16px rgba(255,255,255,0.04);
      color: #f3f4f6;
      animation: popIn 0.16s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 2px solid #374151;
      background: #1f2937;
      border-radius: 9px 9px 0 0;
    }
    .modal-header h2 {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-close {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 8px;
    }
    .modal-close:hover { color: #fff; }
    .modal-tabs {
      display: flex;
      background: #111827;
      border-bottom: 1px solid #374151;
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      padding: 11px 8px;
      background: none;
      border: none;
      color: #94a3b8;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      text-align: center;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }
    .modal-body {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }
    .grid-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }
    .card-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-item.equipped {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.08);
    }
    .rarity-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      align-self: flex-start;
    }
    #minigame-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      max-width: 460px;
      background: rgba(15, 23, 42, 0.98);
      border: 3px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(56, 189, 248, 0.35);
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .minigame-header {
      font-size: 19px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .minigame-badge {
      font-size: 11px;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .minigame-prompt {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .bar-outer {
      width: 100%;
      height: 32px;
      background: #020617;
      border: 2px solid #475569;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #10b981);
      transition: width 0.05s linear;
    }
    #mobile-controls {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 98px;
      background: linear-gradient(0deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.45) 75%, transparent 100%);
      z-index: 25;
      padding: 10px 16px 14px 16px;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .d-pad, .action-pad {
      pointer-events: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .touch-btn {
      width: 62px;
      height: 62px;
      border-radius: 12px;
      background: #1e293b;
      border: 2px solid #64748b;
      color: #f8fafc;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #0f172a;
    }
    .touch-btn:active, .touch-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f172a;
      background: #334155;
    }
    .touch-btn.main-action {
      width: 96px;
      background: #0284c7;
      border-color: #38bdf8;
      font-size: 15px;
    }
    .touch-btn span.label {
      font-size: 10px;
      font-weight: normal;
      color: #94a3b8;
    }
    #catch-celebration {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      max-width: 420px;
      background: #0f172a;
      border: 3px solid #fbbf24;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.45);
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .fishdex-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .fishdex-card.locked {
      opacity: 0.42;
      filter: grayscale(1);
    }
    @media (pointer: coarse) or (max-width: 768px) {
      #mobile-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Top HUD Bar -->
    <div class="top-bar">
      <div class="hud-left">
        <a href="index.html" class="btn-pixel cyan">← 回首頁</a>
        <div class="badge-gold">💰 <span id="hud-coins">0</span></div>

    <div class="modal-backdrop" id="modal-bag">
      <div class="pixel-box">
        <div class="modal-header">
          <h2>🎒 我的無底水產背包 (<span id="bag-total-count">0</span> 條魚)</h2>
          <button class="modal-close" data-close="modal-bag">&times;</button>
        </div>
        <div class="modal-body">
          <div id="bag-fish-list" class="grid-items"></div>
        </div>
      </div>

    <div class="modal-backdrop" id="modal-dex">
      <div class="pixel-box" style="max-width: 820px;">
        <div class="modal-header">
          <h2>📖 悠閒海灣魚類大百科 (<span id="dex-collected-text">0/70</span>)</h2>
          <button class="modal-close" data-close="modal-dex">&times;</button>
        </div>
        <div class="modal-tabs" id="dex-filter-tabs">

        </div>

  <script>
    const Sound = (() => {
      let ctx = null;
      let muted = false;

      function getContext() {
        if (!ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) ctx = new AudioContext();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
        return ctx;
      }

      function playTone(freq, type = 'sine', duration = 0.15, volume = 0.08) {
        if (muted) return;
        const ac = getContext();
        if (!ac) return;
        try {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ac.currentTime);
          gain.gain.setValueAtTime(volume, ac.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start();
          osc.stop(ac.currentTime + duration);
        } catch(e){}
      }

      return {
        toggleMute() {
          muted = !muted;
          return muted;
        },
        isMuted() { return muted; },
        cast() {
          if (muted) return;
          const ac = getContext();
          if (!ac) return;
          try {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.frequency.setValueAtTime(320, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.22);
            gain.gain.setValueAtTime(0.1, ac.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, ac.currentTime + 0.22);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + 0.22);
          } catch(e){}
        },
        bite() {
          playTone(660, 'sine', 0.1, 0.12);
          setTimeout(() => playTone(990, 'sine', 0.18, 0.14), 80);
        },
        coin() {
          playTone(987.77, 'triangle', 0.08, 0.1);
          setTimeout(() => playTone(1318.51, 'triangle', 0.14, 0.1), 70);
        },
        fanfare() {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            setTimeout(() => playTone(freq, 'triangle', 0.2, 0.12), idx * 80);
          });
        },
        fail() {
          playTone(220, 'sine', 0.2, 0.08);
        },
        tick() {
          playTone(520, 'sine', 0.05, 0.04);
        }
      };
    })();

    const RARITY_INFO = {
      common: { name: '普通', color: '#86e016', weight: 60 },
      uncommon: { name: '罕見', color: '#22c55e', weight: 25 },
      rare: { name: '稀有', color: '#38bdf8', weight: 10 },
      epic: { name: '史詩', color: '#a855f7', weight: 4 },
      legendary: { name: '傳說', color: '#eab308', weight: 1 },
      mythic: { name: '神話', color: '#ef4444', weight: 0.3 },
      ancient: { name: '遠古', color: '#ec4899', weight: 0.1 }
    };

    // Full 70 Fish database (7 Rarities x 10 Fish each = 70 Fish)
    const FISH_DATABASE = [
      // 1. Common (10)
      { id: 'c1', name: '小鯽魚', rarity: 'common', basePrice: 15, minLen: 8, maxLen: 18, desc: '淡水岸邊最常見的小魚，性情溫和好釣。', color: '#9ca3af', finColor: '#6b7280' },
      { id: 'c2', name: '泥鰍', rarity: 'common', basePrice: 18, minLen: 6, maxLen: 15, desc: '喜歡在淺灘泥沙中嬉戲，身體滑溜無比。', color: '#78716c', finColor: '#57534e' },
      { id: 'c3', name: '溪哥', rarity: 'common', basePrice: 20, minLen: 7, maxLen: 16, desc: '清澈水域常見的小型魚，動作輕盈活潑。', color: '#38bdf8', finColor: '#0284c7' },
      { id: 'c4', name: '小丑魚', rarity: 'common', basePrice: 24, minLen: 5, maxLen: 12, desc: '橙白斑紋相間的可愛小魚，喜歡海葵花叢。', color: '#fb923c', finColor: '#ffffff' },

    function rollFish() {
      const bait = BAITS[State.equippedBait];
      const rod = RODS[State.equippedRod];

      const weights = { ...bait.weights };
      weights.rare *= rod.luck;
      weights.epic *= rod.luck;
      weights.legendary *= rod.luck;
      weights.mythic *= rod.luck;
      weights.ancient *= rod.luck;

      let totalWeight = 0;
      for (const k in weights) totalWeight += weights[k];

      let randomVal = Math.random() * totalWeight;
      let chosenRarity = 'common';

      for (const rarity of ['ancient', 'mythic', 'legendary', 'epic', 'rare', 'uncommon', 'common']) {
        if (randomVal <= weights[rarity]) {
          chosenRarity = rarity;
          break;
        }
        randomVal -= weights[rarity];
      }

      const candidates = FISH_DATABASE.filter(f => f.rarity === chosenRarity);
      const template = candidates[Math.floor(Math.random() * candidates.length)];

      const length = Math.round((template.minLen + Math.random() * (template.maxLen - template.minLen)) * 10) / 10;
      const sizeMultiplier = 0.85 + (length - template.minLen) / (template.maxLen - template.minLen) * 0.35;
      const price = Math.round(template.basePrice * sizeMultiplier);

      return {
        ...template,
        length,
        price
      };
    }

      bindHoldButton(btnId) {

        const start = (e) => { e.preventDefault(); this.sub.isHolding = true; };
        const end = (e) => { e.preventDefault(); this.sub.isHolding = false; };
        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointercancel', end);
        btn.addEventListener('pointerleave', end);
      },

      update() {
        if (!this.active) return;

        if (this.type === 0) {
          // 1. Balance update (Super gentle movement & rapid capture)
          const s = this.sub;
          if (s.isHolding) s.boxVx += 0.45;
          else s.boxVx -= 0.38;
          s.boxVx *= 0.88;
          s.boxX += s.boxVx;
          if (s.boxX < 0) { s.boxX = 0; s.boxVx = 0; }
          const maxLeft = 100 - s.boxWidthPercent;
          if (s.boxX > maxLeft) { s.boxX = maxLeft; s.boxVx = 0; }

          // Fish floats like a peaceful leaf
          if (Math.random() < 0.02) {
            s.fishTargetX = 15 + Math.random() * 65;
          }
          s.fishX += (s.fishTargetX - s.fishX) * 0.035;

          const fishInside = s.fishX >= s.boxX && s.fishX <= s.boxX + s.boxWidthPercent;
          if (fishInside) {
            this.progress += 1.1; // Fills very fast (~2.5s)
          } else {
            this.progress -= 0.12; // Almost no penalty when outside
          }

          const catchEl = document.getElementById('mg-catch-box');
          const fishEl = document.getElementById('mg-fish-icon');
          const progEl = document.getElementById('mg-progress-bar');
          if (catchEl) catchEl.style.left = s.boxX + '%';
          if (fishEl) fishEl.style.left = s.fishX + '%';
          if (progEl) progEl.style.width = Math.min(100, Math.max(0, this.progress)) + '%';

          if (this.progress >= 100) this.succeed();

        } else if (this.type === 1) {
          // 2. Reel Speed (Very mild drain)
          const s = this.sub;
          this.progress -= s.drainSpeed;
          const progEl = document.getElementById('mg-progress-bar');
          if (progEl) progEl.style.width = Math.min(100, Math.max(0, this.progress)) + '%';

          if (this.progress >= 100) this.succeed();

        } else if (this.type === 2) {
          // 3. Timing Strike (Slow swinging pendulum)
          const s = this.sub;
          s.needleX += s.speed * s.needleDir;
          if (s.needleX >= 98) { s.needleX = 98; s.needleDir = -1; }
          if (s.needleX <= 0) { s.needleX = 0; s.needleDir = 1; }
          const needleEl = document.getElementById('mg-needle');
          if (needleEl) needleEl.style.left = s.needleX + '%';

        } else if (this.type === 3) {
          // 4. Arrow Rhythm (12 seconds countdown)
          const s = this.sub;
          s.remainingTime -= 1;
          const timeBar = document.getElementById('mg-timer-bar');
          if (timeBar) timeBar.style.width = ((s.remainingTime / s.maxTime) * 100) + '%';
          if (s.remainingTime <= 0) {
            this.fail('時間到囉，魚兒悠悠遊走啦～');
          }

        } else if (this.type === 4) {
          // 5. Tension Control (Gentle & quick success)
          const s = this.sub;
          if (s.isHolding) s.tension += 0.7;
          else s.tension -= 0.55;

          const pointer = document.getElementById('mg-tension-pointer');
          if (pointer) pointer.style.left = Math.min(97, Math.max(0, s.tension)) + '%';

          if (s.tension >= s.safeStart && s.tension <= s.safeEnd) {
            s.maintainTime++;
            this.progress = (s.maintainTime / s.targetTime) * 100;
          } else {
            s.maintainTime = Math.max(0, s.maintainTime - 0.25);
            this.progress = (s.maintainTime / s.targetTime) * 100;
          }

          const progEl = document.getElementById('mg-progress-bar');
          if (progEl) progEl.style.width = Math.min(100, Math.max(0, this.progress)) + '%';

          if (s.maintainTime >= s.targetTime) this.succeed();
        }
      },

      handleTimingHit() {
        if (!this.active || this.type !== 2) return;
        const s = this.sub;
        if (s.needleX >= s.zoneLeft && s.needleX <= s.zoneLeft + s.zoneWidth) {
          s.strikes++;
          Sound.bite();
          const strikeEl = document.getElementById('mg-strike-count');
          if (strikeEl) strikeEl.textContent = `成功次數：${s.strikes} / ${s.targetStrikes}`;
          if (s.strikes >= s.targetStrikes) {
            this.succeed();
          }
        } else {
          Sound.fail();
          showToast('差一點點，放輕鬆抓準綠區再試一次！');
        }
      },

      handleArrowInput(dir) {
        if (!this.active || this.type !== 3) return;
        const s = this.sub;
        const expected = s.sequence[s.currentIndex];
        if (dir === expected) {
          Sound.tick();
          const arrowEl = document.getElementById(`mg-arrow-${s.currentIndex}`);
          if (arrowEl) {
            arrowEl.style.background = '#22c55e';
            arrowEl.style.borderColor = '#16a34a';
            arrowEl.style.color = '#fff';
          }
          s.currentIndex++;
          if (s.currentIndex >= s.sequence.length) {
            this.succeed();
          } else {
            this.highlightCurrentArrow();
          }
        } else {
          Sound.fail();
          showToast('方向不太一樣喔～放輕鬆再看一眼！');
        }
      },

      highlightCurrentArrow() {
        const curEl = document.getElementById(`mg-arrow-${this.sub.currentIndex}`);
        if (curEl) {
          curEl.style.borderColor = '#38bdf8';
          curEl.style.boxShadow = '0 0 12px #38bdf8';
          curEl.style.color = '#38bdf8';
        }
      },

      succeed() {
        this.active = false;
        document.getElementById('minigame-container').style.display = 'none';

        const bait = BAITS[State.equippedBait];
        if (bait.count !== Infinity) {
          bait.count--;
          if (bait.count <= 0) {
            bait.count = 0;
            State.equippedBait = 0; // fallback to free bait
          }
        }

        State.bag.push(this.fish);
        const dexEntry = State.dex[this.fish.id];
        dexEntry.caught = true;
        dexEntry.count = (dexEntry.count || 0) + 1;
        if (this.fish.length > dexEntry.maxLen) dexEntry.maxLen = this.fish.length;

        Player.state = 'idle';
        Sound.fanfare();
        showCatchModal(this.fish);
        updateUI();
      },

      fail(reason = '魚兒脫鉤游走了～休閒養老不急，再拋一次竿吧！') {
        this.active = false;
        document.getElementById('minigame-container').style.display = 'none';
        Player.cancelFishing(reason);
      }
    };

    function showCatchModal(fish) {
      const modal = document.getElementById('catch-celebration');

    function drawPixelFish(c, cx, cy, fish, scale = 1.0) {
      c.save();
      c.translate(cx, cy);
      c.scale(scale, scale);

      // Body base
      c.fillStyle = fish.color;
      c.beginPath();
      c.ellipse(0, 0, 14, 8, 0, 0, Math.PI * 2);
      c.fill();

      // Tail fin
      c.fillStyle = fish.finColor;
      c.beginPath();
      c.moveTo(-12, 0);
      c.lineTo(-20, -7);
      c.lineTo(-17, 0);
      c.lineTo(-20, 7);
      c.closePath();
      c.fill();

      // Dorsal fin
      c.beginPath();
      c.moveTo(-4, -7);
      c.lineTo(4, -12);
      c.lineTo(8, -6);
      c.closePath();
      c.fill();

      // Eye
      c.fillStyle = '#ffffff';
      c.fillRect(7, -3, 3, 3);
      c.fillStyle = '#0f172a';
      c.fillRect(8, -2, 2, 2);

      c.restore();
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      const camX = Camera.x;

      // 1. Cozy Twilight Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, WATER_SURFACE_Y);
      skyGrad.addColorStop(0, '#0c1b33');
      skyGrad.addColorStop(0.6, '#1e3a5f');
      skyGrad.addColorStop(1, '#f97316');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, WATER_SURFACE_Y);

      // Distant rolling hills
      ctx.fillStyle = '#172554';
      ctx.beginPath();
      ctx.moveTo(0, WATER_SURFACE_Y);
      for (let i = 0; i <= width; i += 70) {
        const mx = i + (camX * 0.2);
        const my = WATER_SURFACE_Y - 45 - Math.sin(mx * 0.009) * 30;
        ctx.lineTo(i, my);
      }
      ctx.lineTo(width, WATER_SURFACE_Y);
      ctx.closePath();
      ctx.fill();

      // 2. Clear soothing ocean waters
      const waterGrad = ctx.createLinearGradient(0, WATER_SURFACE_Y, 0, height);
      waterGrad.addColorStop(0, '#0284c7');
      waterGrad.addColorStop(0.35, '#0369a1');
      waterGrad.addColorStop(1, '#082f49');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, WATER_SURFACE_Y, width, height - WATER_SURFACE_Y);

      // Swimming fish shadows in background
      ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
      ambientFish.forEach(f => {
        const sx = f.x - camX;
        if (sx > -60 && sx < width + 60) {
          f.x += f.speed * f.dir;
          if (f.x > WORLD_WIDTH - 60) f.dir = -1;
          if (f.x < PIER_END) f.dir = 1;
          ctx.beginPath();
          ctx.ellipse(sx, f.y, f.len, 5, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Animated Water waves
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      const time = performance.now() * 0.0025;
      for (let x = 0; x < width; x += 18) {
        const wx = x + camX;
        const wy = WATER_SURFACE_Y + Math.sin(wx * 0.045 + time) * 3;
        ctx.fillRect(x, wy, 14, 2);
      }

      // 3. Grassy Shoreline
      const shoreEndX = PIER_START - camX;
      if (shoreEndX > 0) {
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0 - camX, GROUND_Y, PIER_START, 24);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(0 - camX, GROUND_Y + 24, PIER_START, height - GROUND_Y);
      }

      // 4. Wooden Pier
      const pierScreenStart = PIER_START - camX;
      const pierWidth = PIER_END - PIER_START;
      ctx.fillStyle = '#451a03';
      for (let px = PIER_START + 35; px < PIER_END; px += 85) {
        const sx = px - camX;
        ctx.fillRect(sx - 5, GROUND_Y, 10, height - GROUND_Y);
      }
      ctx.fillStyle = '#78350f';
      ctx.fillRect(pierScreenStart, GROUND_Y, pierWidth, 14);
      ctx.fillStyle = '#92400e';
      ctx.fillRect(pierScreenStart, GROUND_Y - 2, pierWidth, 4);

      // 5. Campfire and NPC
      const cfx = Campfire.x - camX;
      ctx.fillStyle = '#451a03';
      ctx.fillRect(cfx - 12, Campfire.y, 24, 6);
      Campfire.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camX, p.y, p.size, p.size);
      });

      // Merchant NPC
      const npx = NPC_Merchant.x - camX;
      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(npx - 10, NPC_Merchant.y - 48, 20, 6);
      ctx.fillRect(npx - 6, NPC_Merchant.y - 54, 12, 6);
      ctx.fillStyle = '#fde047';
      ctx.fillRect(npx - 7, NPC_Merchant.y - 42, 14, 12);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(npx - 6, NPC_Merchant.y - 32, 12, 8);
      ctx.fillStyle = '#065f46';
      ctx.fillRect(npx - 9, NPC_Merchant.y - 24, 18, 24);

      if (NPC_Merchant.isNear(Player.x)) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(npx - 58, NPC_Merchant.y - 84, 116, 26);
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        ctx.strokeRect(npx - 58, NPC_Merchant.y - 84, 116, 26);
        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💬 [E] 對話 / 商店', npx, NPC_Merchant.y - 67);
      }

      const plx = Player.x - camX;
      const ply = Player.y;

      ctx.save();
      ctx.translate(plx, ply);
      ctx.scale(Player.direction, 1);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Legs / Walk
      ctx.fillStyle = '#1e293b';
      if (Player.state === 'walk') {
        const legOff = Math.sin(Player.animTimer * 0.5) * 5;
        ctx.fillRect(-6, -14, 4, 14 + legOff);
        ctx.fillRect(2, -14, 4, 14 - legOff);
      } else {
        ctx.fillRect(-6, -14, 4, 14);
        ctx.fillRect(2, -14, 4, 14);
      }

      // Cozy Blue Jacket
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(-8, -32, 16, 18);

      // Head
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(-6, -44, 12, 12);

      // Beanie hat
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(-8, -50, 16, 7);

      // Fishing Rod
      const rodColors = ['#ca8a04', '#78350f', '#334155', '#94a3b8', '#38bdf8', '#dc2626', '#eab308'];
      ctx.lineWidth = 3;
      ctx.strokeStyle = rodColors[State.equippedRod] || '#ca8a04';

      if (Player.state === 'waiting' || Player.state === 'biting' || Player.state === 'minigame') {
        ctx.beginPath();
        ctx.moveTo(2, -26);
        ctx.lineTo(24, -42);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(0, -26);
        ctx.lineTo(16, -56);
        ctx.stroke();
      }
      ctx.restore();

      // Fishing Line & Float Bobber
      if (Player.state === 'waiting' || Player.state === 'biting' || Player.state === 'minigame') {
        const rodTipX = plx + (24 * Player.direction);
        const rodTipY = ply - 42;
        const bobX = Player.bobberTargetX - camX;
        const bobY = Player.bobberTargetY + Math.sin(performance.now() * 0.005) * 2;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(rodTipX, rodTipY);
        ctx.quadraticCurveTo((rodTipX + bobX) / 2, (rodTipY + bobY) / 2 + 10, bobX, bobY);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bobX - 3, bobY - 2, 6, 4);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(bobX - 3, bobY - 6, 6, 4);

        if (Player.state === 'biting' || Player.state === 'minigame') {
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(plx - 5, ply - 75, 10, 22);
          ctx.fillRect(plx - 5, ply - 50, 10, 6);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.beginPath();
          ctx.arc(bobX, bobY, (performance.now() * 0.02) % 18, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // Water splashes
      for (let i = splashes.length - 1; i >= 0; i--) {
        const s = splashes[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.15;
        s.alpha -= 0.03;
        if (s.alpha <= 0) {
          splashes.splice(i, 1);
          continue;
        }
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fillRect(s.x - camX, s.y, s.size, s.size);
      }
    }

    function gameLoop() {
      Player.update();
      Campfire.update();
      Camera.update(Player.x);
      MiniGame.update();
      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }

      if (MiniGame.active) {
        if (MiniGame.type === 0 || MiniGame.type === 4) {
          if (e.code === 'Space') MiniGame.sub.isHolding = true;
        } else if (MiniGame.type === 1) {
          if (e.code === 'Space' || e.code === 'KeyE') MiniGame.handleTapAction();
        } else if (MiniGame.type === 2) {
          if (e.code === 'Space' || e.code === 'KeyE') MiniGame.handleTimingHit();
        } else if (MiniGame.type === 3) {
          if (e.code === 'ArrowUp' || e.code === 'KeyW') MiniGame.handleArrowInput('↑');
          if (e.code === 'ArrowDown' || e.code === 'KeyS') MiniGame.handleArrowInput('↓');
          if (e.code === 'ArrowLeft' || e.code === 'KeyA') MiniGame.handleArrowInput('←');
          if (e.code === 'ArrowRight' || e.code === 'KeyD') MiniGame.handleArrowInput('→');
        }
        return;
      }

      if (e.code === 'KeyA' || e.code === 'ArrowLeft') Player.vx = -Player.speed;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') Player.vx = Player.speed;

      if (e.code === 'Space') handleMainAction();
      if (e.code === 'KeyE') {
        if (NPC_Merchant.isNear(Player.x)) openShopModal();
        else handleMainAction();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (MiniGame.active) {
        if ((MiniGame.type === 0 || MiniGame.type === 4) && e.code === 'Space') {
          MiniGame.sub.isHolding = false;
        }
      }
      if ((e.code === 'KeyA' || e.code === 'ArrowLeft') && Player.vx < 0) Player.vx = 0;
      if ((e.code === 'KeyD' || e.code === 'ArrowRight') && Player.vx > 0) Player.vx = 0;
    });

    function handleMainAction() {
      if (MiniGame.active) return;
      if (Player.state === 'idle' || Player.state === 'walk') {
        Player.castRod();
      } else if (Player.state === 'waiting') {
        Player.cancelFishing('放空收竿，隨時都可以再拋竿喔～');
      } else if (Player.state === 'biting') {
        MiniGame.start(Player.activeBiteFish);
      }
    }

    const btnLeft = document.getElementById('m-btn-left');
    const btnRight = document.getElementById('m-btn-right');
    const btnAction = document.getElementById('m-btn-action');
    const btnInteract = document.getElementById('m-btn-interact');

    function bindTouchMove(btn, speed) {
      const start = (e) => { e.preventDefault(); Player.vx = speed; btn.classList.add('pressed'); };
      const end = (e) => { e.preventDefault(); if (Player.vx === speed) Player.vx = 0; btn.classList.remove('pressed'); };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', end);
      btn.addEventListener('pointercancel', end);
      btn.addEventListener('pointerleave', end);
    }
    bindTouchMove(btnLeft, -Player.speed);
    bindTouchMove(btnRight, Player.speed);

    btnAction.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleMainAction();
    });

    btnInteract.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (NPC_Merchant.isNear(Player.x)) openShopModal();
      else showToast('請先走近左側營火旁的老漁夫商人～');
    });

    function updateUI() {
      document.getElementById('hud-coins').textContent = State.coins.toLocaleString();

      const bait = BAITS[State.equippedBait];
      document.getElementById('hud-bait-info').innerHTML = `🪱 ${bait.name} ×<span id="hud-bait-count">${bait.count === Infinity ? '∞' : bait.count}</span>`;
      document.getElementById('hud-bag-count').textContent = State.bag.length;

      for (const k in State.dex) {
        if (State.dex[k].caught) caughtCount++;
      }
      document.getElementById('hud-dex-count').textContent = `${caughtCount}/70`;

      if (Player.state === 'biting') {
        btnAction.innerHTML = '⚡ 輕觸起線！<span class="label">魚上鉤了</span>';

        btnAction.innerHTML = '⏳ 靜候中<span class="label">點擊提早收竿</span>';
        btnAction.style.background = '#ca8a04';

        btnAction.innerHTML = '🎣 拋竿<span class="label">點擊拋出</span>';
        btnAction.style.background = '#0284c7';
      }
    }
    updateUI();

      btn.addEventListener('click', () => {
        document.getElementById(btn.getAttribute('data-close')).classList.remove('active');
      });

    function showToast(msg) {

      div.textContent = msg;
      div.style.position = 'absolute';
      div.style.top = '66px';
      div.style.left = '50%';
      div.style.transform = 'translateX(-50%)';
      div.style.background = 'rgba(15, 23, 42, 0.96)';
      div.style.border = '2px solid #38bdf8';
      div.style.borderRadius = '8px';
      div.style.padding = '8px 16px';

    document.getElementById('btn-sell-all').addEventListener('click', () => {

    function renderShopBaitTab() {
      const pane = document.getElementById('shop-bait-pane');
      pane.innerHTML = '';
      BAITS.forEach(bait => {
        const isEquipped = State.equippedBait === bait.id;
        const card = document.createElement('div');
        card.className = `card-item ${isEquipped ? 'equipped' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>🪱 ${bait.name}</strong>
            <span style="font-size:12px; color:#38bdf8;">擁有: ${bait.count === Infinity ? '無限' : bait.count}</span>
          </div>
          <p style="font-size:12px; color:#cbd5e1; line-height:1.4;">${bait.desc}</p>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
            <span style="font-weight:bold; color:#fbbf24;">${bait.price === 0 ? '免費使用' : `💰 ${bait.price} / 5個`}</span>
            <div style="display:flex; gap:6px;">
              ${bait.price > 0 ? `<button class="btn-pixel gold" style="padding:4px 8px; font-size:12px;" data-buy-bait="${bait.id}">購買</button>` : ''}
              <button class="btn-pixel ${isEquipped ? 'cyan' : ''}" style="padding:4px 8px; font-size:12px;" data-equip-bait="${bait.id}">
                ${isEquipped ? '裝備中' : '裝備'}
              </button>
            </div>
          </div>
        `;
        pane.appendChild(card);
      });

      pane.querySelectorAll('[data-buy-bait]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-buy-bait'), 10);
          const b = BAITS[id];
          if (State.coins < b.price) {
            showToast('金幣還差一點點喔，多釣幾條魚再來吧！');
            return;
          }
          State.coins -= b.price;
          b.count += 5;
          Sound.coin();
          showToast(`已購入 5 個【${b.name}】！`);
          updateUI();
          renderShopBaitTab();
        });
      });

      pane.querySelectorAll('[data-equip-bait]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-equip-bait'), 10);
          State.equippedBait = id;
          Sound.tick();
          showToast(`已裝備【${BAITS[id].name}】！`);
          updateUI();
          renderShopBaitTab();
        });
      });
    }

    function renderShopRodTab() {
      const pane = document.getElementById('shop-rod-pane');
      pane.innerHTML = '';
      RODS.forEach(rod => {
        const isUnlocked = State.unlockedRods.includes(rod.id);
        const isEquipped = State.equippedRod === rod.id;
        const card = document.createElement('div');
        card.className = `card-item ${isEquipped ? 'equipped' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>🎣 ${rod.name}</strong>
            <span style="font-size:11px; padding:2px 6px; border-radius:4px; background:${isEquipped ? '#22c55e' : '#475569'}; color:#fff;">
              ${isEquipped ? '使用中' : (isUnlocked ? '已擁有' : '未解鎖')}
            </span>
          </div>
          <p style="font-size:12px; color:#cbd5e1; line-height:1.4;">${rod.desc}</p>
          <div style="font-size:11px; color:#38bdf8; display:flex; gap:10px;">
            <span>幸運倍率: ×${rod.luck}</span>
            <span>安全區放寬: +${rod.bonusWidth}px</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
            <span style="font-weight:bold; color:#fbbf24;">${rod.price === 0 ? '自帶' : `💰 ${rod.price.toLocaleString()}`}</span>
            <div>
              ${!isUnlocked ? `<button class="btn-pixel gold" style="padding:4px 10px; font-size:12px;" data-buy-rod="${rod.id}">升級工藝</button>` :
              `<button class="btn-pixel ${isEquipped ? 'cyan' : ''}" style="padding:4px 10px; font-size:12px;" data-equip-rod="${rod.id}">${isEquipped ? '裝備中' : '裝備'}</button>`}
            </div>
          </div>
        `;
        pane.appendChild(card);
      });

      pane.querySelectorAll('[data-buy-rod]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-buy-rod'), 10);
          const r = RODS[id];
          if (State.coins < r.price) {
            showToast('金幣還不夠升級這把釣竿喔！');
            return;
          }
          State.coins -= r.price;
          State.unlockedRods.push(id);
          State.equippedRod = id;
          Sound.fanfare();
          showToast(`恭喜升級鍛造獲得【${r.name}】！安全區更寬更愜意！`);
          updateUI();
          renderShopRodTab();
        });
      });

      pane.querySelectorAll('[data-equip-rod]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-equip-rod'), 10);
          State.equippedRod = id;
          Sound.tick();
          showToast(`已換上【${RODS[id].name}】！`);
          updateUI();
          renderShopRodTab();
        });
      });
    }

    document.getElementById('btn-open-bag').addEventListener('click', () => {
      const pane = document.getElementById('bag-fish-list');
      pane.innerHTML = '';
      document.getElementById('bag-total-count').textContent = State.bag.length;
      if (State.bag.length === 0) {
        pane.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:32px;">背包目前空蕩蕩，去海邊拋一竿看看吧！🎣</div>`;
      } else {
        State.bag.forEach(fish => {
          const rInfo = RARITY_INFO[fish.rarity];
          const div = document.createElement('div');
          div.className = 'card-item';
          div.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
              <strong style="color:${rInfo.color};">${fish.name}</strong>
              <span class="rarity-tag" style="background:${rInfo.color}; color:#000;">${rInfo.name}</span>
            </div>
            <div style="font-size:12px; color:#94a3b8;">體長: ${fish.length}cm | 價值: ${fish.price} 金幣</div>
            <div style="font-size:11px; color:#cbd5e1; margin-top:2px;">${fish.desc}</div>
          `;
          pane.appendChild(div);
        });
      }
      document.getElementById('modal-bag').classList.add('active');
    });

    let currentDexFilter = 'all';
    document.getElementById('btn-open-dex').addEventListener('click', () => {
      renderFishdex();
      document.getElementById('modal-dex').classList.add('active');
    });

    document.querySelectorAll('#dex-filter-tabs .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#dex-filter-tabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDexFilter = btn.getAttribute('data-rarity');
        renderFishdex();
      });
    });

    function renderFishdex() {
      const container = document.getElementById('dex-fish-list');
      container.innerHTML = '';

      let filtered = FISH_DATABASE;
      if (currentDexFilter !== 'all') {
        filtered = FISH_DATABASE.filter(f => f.rarity === currentDexFilter);
      }

      let caughtTotal = 0;
      FISH_DATABASE.forEach(f => {
        if (State.dex[f.id].caught) caughtTotal++;
      });
      document.getElementById('dex-collected-text').textContent = `${caughtTotal}/70`;

      filtered.forEach(fish => {
        const info = State.dex[fish.id];
        const isCaught = info.caught;
        const rInfo = RARITY_INFO[fish.rarity];

        const card = document.createElement('div');
        card.className = `fishdex-card ${isCaught ? '' : 'locked'}`;
        card.innerHTML = `
          <div style="width:48px; height:48px; background:#0f172a; border:1px solid ${isCaught ? rInfo.color : '#334155'}; border-radius:6px; display:flex; align-items:center; justify-content:center;">
            ${isCaught ? `<div style="font-size:24px;">🐟</div>` : `<span style="font-size:18px; color:#64748b;">?</span>`}
          </div>
          <div style="flex:1;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="color:${isCaught ? rInfo.color : '#94a3b8'};">${isCaught ? fish.name : '？？？？'}</strong>
              <span class="rarity-tag" style="background:${rInfo.color}; color:#000;">${rInfo.name}</span>
            </div>
            <div style="font-size:12px; color:#94a3b8; margin-top:2px;">
              ${isCaught ? `最大體長: ${info.maxLen}cm | 捕獲次數: ${info.count}` : '尚未捕獲過此魚種'}
            </div>
            <div style="font-size:11px; color:#cbd5e1; margin-top:2px;">
              ${isCaught ? fish.desc : '在悠閒海灣深水區游曳的神秘魚兒...'}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
